# Local inspector queue. Every path answers; the module decides by the reason code.
#
# queue_max also sizes the NATS subscription buffer: queue_max + 4. When that buffer overflows, the
# client drops messages silently and the module waits out waf_deadline, so size it for the arrival
# rate times a scheduling pause: 256 is about 25 ms at 10 000 messages per second.
#
# queue_max     requests waiting for evaluation, not counting the one in progress
# queue_full    drop: answer error VLAI_QUEUE_LIMIT at once
#               wait: wait for room until deadline_ms, otherwise VLAI_DEADLINE
# queue_expand  ask: ask the controller to expand (not sent yet)
#               off: do not ask
#
# A profile's overload setting overrides queue_full once the controller has sent profiles.

queue_max     256;
queue_full    drop;
queue_expand  off;

# Exchange Redis, the same form as in agent.conf; REDIS_URL overrides it. The request body and query
# string are read from it; the inspector does not use the internal Redis and rejects internal.
redis {
    url       redis://redis:6379;
}
